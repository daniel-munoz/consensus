<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="#4f46e5"/>

  <!-- Stylized AI/Robot face -->
  <rect x="25" y="30" width="50" height="40" rx="8" fill="#ffffff"/>

  <!-- Eyes (representing multiple AI providers) -->
  <circle cx="37" cy="45" r="6" fill="#4f46e5"/>
  <circle cx="63" cy="45" r="6" fill="#4f46e5"/>

  <!-- Eye highlights -->
  <circle cx="39" cy="43" r="2" fill="#ffffff"/>
  <circle cx="65" cy="43" r="2" fill="#ffffff"/>

  <!-- Mouth/speaker grid (consensus output) -->
  <rect x="35" y="55" width="30" height="8" rx="2" fill="#4f46e5"/>
  <line x1="42" y1="55" x2="42" y2="63" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="50" y1="55" x2="50" y2="63" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="58" y1="55" x2="58" y2="63" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Antenna -->
  <line x1="50" y1="30" x2="50" y2="18" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="15" r="5" fill="#10b981"/>
</svg>
