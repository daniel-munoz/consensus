<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consensus AI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <div class="app-title">
                    <div class="app-icon">🤖</div>
                    <h1>Consensus AI</h1>
                </div>
                <div class="header-actions">
                    <button class="btn btn-icon" id="settings-btn" title="Settings">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1 1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="app-main">
            <!-- Input Panel -->
            <div class="input-panel">
                <div class="input-section">
                    <label for="prompt-input">Your Request</label>
                    <textarea 
                        id="prompt-input" 
                        placeholder="Enter your question or request here..."
                        rows="4"
                    ></textarea>
                </div>

                <!-- Configuration Panel -->
                <div class="config-panel">
                    <div class="config-group">
                        <div class="config-header">
                            <h3>Master Prompt Optimization</h3>
                            <label class="toggle-switch">
                                <input type="checkbox" id="master-prompt-toggle" checked>
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                        <div class="config-content" id="master-prompt-config">
                            <div class="form-group">
                                <label for="master-provider">Provider:</label>
                                <select id="master-provider">
                                    <option value="openai" selected>OpenAI</option>
                                    <option value="anthropic">Anthropic</option>
                                    <option value="gemini">Gemini</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="config-group">
                        <div class="config-header">
                            <h3>Response Providers</h3>
                        </div>
                        <div class="config-content">
                            <div class="provider-grid">
                                <label class="provider-card">
                                    <input type="checkbox" value="openai" checked>
                                    <div class="provider-info">
                                        <div class="provider-icon openai"></div>
                                        <span>OpenAI</span>
                                    </div>
                                    <div class="provider-status">
                                        <span class="status-dot"></span>
                                    </div>
                                </label>
                                <label class="provider-card">
                                    <input type="checkbox" value="anthropic" checked>
                                    <div class="provider-info">
                                        <div class="provider-icon anthropic"></div>
                                        <span>Anthropic</span>
                                    </div>
                                    <div class="provider-status">
                                        <span class="status-dot"></span>
                                    </div>
                                </label>
                                <label class="provider-card">
                                    <input type="checkbox" value="gemini" checked>
                                    <div class="provider-info">
                                        <div class="provider-icon gemini"></div>
                                        <span>Gemini</span>
                                    </div>
                                    <div class="provider-status">
                                        <span class="status-dot"></span>
                                    </div>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="config-group">
                        <div class="config-header">
                            <h3>Email Notifications</h3>
                        </div>
                        <div class="config-content">
                            <div class="form-group">
                                <input 
                                    type="email" 
                                    id="email-input" 
                                    placeholder="email1@example.com, email2@example.com"
                                    multiple
                                >
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="action-buttons">
                    <button class="btn btn-secondary" id="clear-btn">Clear</button>
                    <button class="btn btn-primary" id="send-btn">
                        <span class="btn-text">Send Request</span>
                        <span class="btn-loading" style="display: none;">
                            <div class="spinner"></div>
                            Processing...
                        </span>
                    </button>
                </div>
            </div>

            <!-- Results Panel -->
            <div class="results-panel" id="results-panel" style="display: none;">
                <div class="results-header">
                    <h2>Results</h2>
                    <div class="results-actions">
                        <button class="btn btn-icon" id="save-results-btn" title="Save Results">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                                <polyline points="17,21 17,13 7,13 7,21"></polyline>
                                <polyline points="7,3 7,8 15,8"></polyline>
                            </svg>
                        </button>
                        <button class="btn btn-icon" id="export-results-btn" title="Export Results">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="7,10 12,15 17,10"></polyline>
                                <line x1="12" y1="15" x2="12" y2="3"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="results-content" id="results-content">
                    <!-- Results will be populated here -->
                </div>
            </div>
        </main>

        <!-- Settings Modal -->
        <div class="modal" id="settings-modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Settings</h2>
                    <button class="btn btn-icon modal-close" id="settings-close">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="settings-section">
                        <h3>API Configuration</h3>
                        <div class="form-group">
                            <label>OpenAI API Key:</label>
                            <input type="password" id="openai-key" placeholder="sk-...">
                        </div>
                        <div class="form-group">
                            <label>Anthropic API Key:</label>
                            <input type="password" id="anthropic-key" placeholder="sk-ant-...">
                        </div>
                        <div class="form-group">
                            <label>Gemini API Key:</label>
                            <input type="password" id="gemini-key" placeholder="AI...">
                        </div>
                    </div>
                    <div class="settings-section">
                        <h3>Email Configuration</h3>
                        <div class="form-group">
                            <label>SMTP Host:</label>
                            <input type="text" id="smtp-host" value="smtp.gmail.com">
                        </div>
                        <div class="form-group">
                            <label>SMTP Port:</label>
                            <input type="number" id="smtp-port" value="587">
                        </div>
                        <div class="form-group">
                            <label>From Email:</label>
                            <input type="email" id="from-email" placeholder="your-email@gmail.com">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" id="settings-cancel">Cancel</button>
                    <button class="btn btn-primary" id="settings-save">Save Settings</button>
                </div>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
